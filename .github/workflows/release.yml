name: Release

# Legt für die Version aus custom_components/water_softener_refill_sensor/manifest.json automatisch Tag und GitHub-Release an,
# sobald diese Version auf main liegt und noch kein Release dafür existiert. Gibt es das Release schon,
# werden nur seine Notes aus CHANGELOG.md aktualisiert.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub-Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version ermitteln
        id: v
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/water_softener_refill_sensor/manifest.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VERSION} existiert bereits."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        if: steps.v.outputs.exists == 'false'
        run: python3 -m unittest discover -s tests
      - name: Release-Notes aus CHANGELOG.md
        run: |
          awk -v v="## ${{ steps.v.outputs.version }}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release v${{ steps.v.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          body_path: notes.md
      - name: Release-Notes eines vorhandenen Releases aktualisieren
        if: steps.v.outputs.exists == 'true'
        run: gh release edit "v${{ steps.v.outputs.version }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
